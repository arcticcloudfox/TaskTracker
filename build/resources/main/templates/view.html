<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Edit Task')"></head>
<body>
<div class="container">
    <h1 class="mt-4">Task View</h1>

    <table class="table table-striped mt-4">
        <tbody>
        <tr>
            <th>Title: </th>
            <td th:text="${task.taskName}"></td>
        </tr>
        <tr>
            <th>Description: </th>
            <td th:text="${task.description}"></td>
        </tr>
        </tbody>
    </table>
    <div th:replace="fragments :: back-button"></div>
</div>

</body>
</html>
