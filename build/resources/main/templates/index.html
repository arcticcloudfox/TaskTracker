<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Edit Task')"></head>

<body>

<div class="container mt-4">
    <h2> Task Tracker </h2>

    <div th:replace="fragments :: add-button"></div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Task Name</th>
            <th>Description</th>
            <th>Completed</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.taskName}">Task Name</td>
            <td th:text="${task.description}">Description</td>
            <td>
                <form th:action="@{'/task/' + ${task.id} + '/completedTask'}" method="post">
                    <input type="checkbox" name="completed" th:checked="${task.completed}" onchange="this.form.submit()"/>
                </form>
            </td>
            <td>
                <a th:href="@{'/task/' + ${task.id} + '/edit'}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{'/task/' +${task.id} + '/delete'}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this task?');">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>

    </table>
</div>

</body>
</html>
